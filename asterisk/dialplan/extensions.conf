; ─── Asterisk Dialplan — Voice AI Receptionist ────────────────────────────────
;
; This routes all inbound calls on the main DID to the AI AGI script.
; Adjust [your-trunk-context] to match your SIP provider trunk context name.
;
; Tested with Asterisk 18 + 20.
; ──────────────────────────────────────────────────────────────────────────────

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
BACKEND_URL=http://127.0.0.1:8000
AUDIO_DIR=/tmp/audio

; ─── Inbound SIP trunk context (set this in sip.conf / pjsip.conf) ───────────
[from-trunk]
exten => _X.,1,NoOp(Inbound call from ${CALLERID(num)} to ${EXTEN})
 same => n,Answer()
 same => n,Wait(1)
 same => n,AGI(/var/lib/asterisk/agi-bin/call_handler.py)
 same => n,Hangup()

; ─── Direct extension for local testing ──────────────────────────────────────
[default]
exten => 100,1,NoOp(Test — AI Receptionist)
 same => n,Answer()
 same => n,AGI(/var/lib/asterisk/agi-bin/call_handler.py)
 same => n,Hangup()

; Voicemail fallback (if AGI fails)
exten => i,1,Playback(invalid)
exten => t,1,Hangup()
exten => h,1,NoOp(Call hung up)

; ─── Outbound (if you need to originate calls from n8n) ──────────────────────
[outbound]
exten => _1NXXNXXXXXX,1,Dial(PJSIP/${EXTEN}@your-sip-trunk,30)
 same => n,Hangup()
