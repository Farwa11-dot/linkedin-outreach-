version: "3.9"

services:
  # ─── FastAPI Backend ────────────────────────────────────
  backend:
    build: ./backend
    container_name: voice_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend:/app
      - ./backend/prompts:/app/prompts
      - audio_temp:/tmp/audio
      - piper_models:/models/piper
    depends_on:
      - db
      - ollama
    networks:
      - voiceai

  # ─── Ollama LLM ─────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - voiceai

  # ─── PostgreSQL (Supabase alternative for local dev) ────
  db:
    image: postgres:15-alpine
    container_name: voice_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: voiceai
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - voiceai

  # ─── Asterisk PBX ───────────────────────────────────────
  asterisk:
    image: andrius/asterisk:latest
    container_name: asterisk
    restart: unless-stopped
    network_mode: host          # SIP/RTP needs host networking
    volumes:
      - ./asterisk/dialplan/extensions.conf:/etc/asterisk/extensions.conf
      - ./asterisk/agi:/var/lib/asterisk/agi-bin
      - audio_temp:/tmp/audio
    environment:
      - BACKEND_URL=http://127.0.0.1:8000

  # ─── n8n Automation ─────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=change_me
      - N8N_HOST=0.0.0.0
      - WEBHOOK_URL=http://localhost:5678
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows
    networks:
      - voiceai

  # ─── Piper TTS (sidecar) ────────────────────────────────
  piper:
    image: rhasspy/wyoming-piper:latest
    container_name: piper_tts
    restart: unless-stopped
    ports:
      - "10200:10200"
    volumes:
      - piper_models:/data
    command: ["--voice", "en_US-lessac-medium"]
    networks:
      - voiceai

volumes:
  ollama_data:
  pg_data:
  n8n_data:
  audio_temp:
  piper_models:

networks:
  voiceai:
    driver: bridge
